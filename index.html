<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MAEK7 Dental Pro | تقارير أشعة الأسنان الاحترافية</title>
    <script type="importmap">
        {
            "imports": {
                "@google/generative-ai": "https://esm.run/@google/generative-ai"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-dark: #0a0c12;
            --bg-card: #0f131c;
            --bg-input: #1a1e29;
            --border: #2d3748;
            --text: #eef2ff;
            --text-muted: #9ca3af;
            --primary: #10a37f;
            --primary-dark: #0d7a5f;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --theme-icon-bg: #f59e0b;
            --theme-icon-color: #1a1e29;
        }

        body.light-mode {
            --bg-dark: #f3f4f6;
            --bg-card: #ffffff;
            --bg-input: #e5e7eb;
            --border: #d1d5db;
            --text: #1f2937;
            --text-muted: #6b7280;
            --theme-icon-bg: #3b82f6;
            --theme-icon-color: #ffffff;
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            padding: 20px;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
        }

        .main-content {
            flex: 1;
            margin-right: 280px;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 768px) {
            .main-content { margin-right: 0; }
        }

        .status-bar {
            background: var(--bg-card);
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .api-input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 40px;
            color: var(--text);
            font-family: monospace;
            width: 300px;
            outline: none;
        }

        .badge {
            background: var(--bg-input);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
        }

        .analysis-area {
            flex: 1;
            padding: 24px 12% 200px 12%;
            overflow-y: auto;
        }

        @media (max-width: 1024px) {
            .analysis-area { padding: 20px 4% 200px 4%; }
        }

        .report-container {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .report-header {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .risk-score {
            background: var(--primary);
            border-radius: 40px;
            padding: 6px 16px;
            font-weight: bold;
            color: white;
        }

        .risk-high { background: var(--danger); }
        .risk-medium { background: var(--warning); }
        .risk-low { background: var(--success); }

        .theme-btn {
            width: 100%;
            background: var(--theme-icon-bg);
            border: none;
            color: var(--theme-icon-color);
            border-radius: 40px;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .theme-btn:hover {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .clear-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: 40px;
            padding: 10px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .clear-btn:hover {
            background: var(--danger);
            color: white;
        }

        .input-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, var(--bg-dark) 70%, transparent);
            padding: 20px 12% 30px 12%;
            margin-right: 280px;
        }

        @media (max-width: 768px) {
            .input-wrapper { margin-right: 0; padding: 16px 4% 24px 4%; }
        }

        .input-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 48px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            outline: none;
            resize: none;
            padding: 12px 0;
            font-family: inherit;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .send-btn {
            background: var(--primary);
            border: none;
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 20px;
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            z-index: 2000;
            animation: slideIn 0.3s;
            direction: rtl;
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .menu-toggle {
            display: none;
            background: var(--primary);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
        }

        .history-item {
            background: var(--bg-input);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
            border-right: 3px solid var(--primary);
        }

        .history-item:hover {
            transform: translateX(-4px);
        }

        .theme-switch-wrapper {
            margin-top: 20px;
        }

        /* مؤشر الكتابة */
        .typing-indicator {
            display: inline-block;
            width: 20px;
            text-align: center;
        }

        .typing-indicator span {
            animation: blink 1.4s infinite;
            font-size: 18px;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar" id="sidebar">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2>🦷 MAEK7 Pro</h2>
            <p style="color: var(--primary); font-size: 12px;">تقارير أشعة احترافية</p>
        </div>
        <div style="margin-bottom: 24px;">
            <h4>📋 التقارير السابقة</h4>
            <div id="historyList">لا توجد تقارير</div>
        </div>
        <div>
            <button class="clear-btn" id="clearDataBtn">🗑️ مسح الكل</button>
            <div class="theme-switch-wrapper">
                <button class="theme-btn" id="themeToggle">
                    🌙 <span id="themeText">الوضع المظلم</span>
                </button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="status-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div>
                <input type="password" id="apiKey" class="api-input" placeholder="🔑 مفتاح Gemini API" oninput="saveApiKey()">
            </div>
            <div class="badge" id="apiStatus">⚙️ انتظار</div>
            <div class="badge">✅ HIPAA Compliant</div>
        </div>

        <div class="analysis-area" id="analysisArea">
            <!-- الرسائل والتقارير تظهر هنا -->
        </div>

        <div class="input-wrapper">
            <div class="input-container">
                <button id="uploadBtn" class="icon-btn" title="رفع صورة">📷</button>
                <button id="galleryBtn" class="icon-btn" title="اختيار من المعرض">🖼️</button>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <textarea id="userMessage" placeholder="اكتب رسالتك هنا ثم اضغط ↑ للإرسال..."></textarea>
                <button id="sendBtn" class="icon-btn send-btn" title="إرسال">↑</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    // ============== المتغيرات العامة ==============
    let chatHistory = [];
    let isProcessing = false;

    // ============== DOM elements ==============
    const sidebar = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menuToggle');
    const apiInput = document.getElementById('apiKey');
    const apiStatus = document.getElementById('apiStatus');
    const analysisArea = document.getElementById('analysisArea');
    const userMessage = document.getElementById('userMessage');
    const sendBtn = document.getElementById('sendBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const galleryBtn = document.getElementById('galleryBtn');
    const fileInput = document.getElementById('fileInput');
    const clearDataBtn = document.getElementById('clearDataBtn');
    const themeToggle = document.getElementById('themeToggle');
    const themeText = document.getElementById('themeText');
    const historyList = document.getElementById('historyList');

    // ============== الدوال الأساسية ==============
    function hasValidApiKey() {
        const key = apiInput.value.trim();
        return key && key.length > 10 && key.startsWith('AIza');
    }

    function updateApiStatus() {
        const hasKey = hasValidApiKey();
        apiStatus.innerHTML = hasKey ? '🟢 جاهز' : '🔴 انتظار';
        apiStatus.style.color = hasKey ? '#10b981' : '#ef4444';
    }

    function saveApiKey() {
        const key = apiInput.value.trim();
        if (key) localStorage.setItem('maek7_api_key', key);
        updateApiStatus();
    }

    function saveChat() { 
        localStorage.setItem('maek7_chat_history', JSON.stringify(chatHistory)); 
    }

    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = isError ? '#ef4444' : 'var(--primary)';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // ============== عرض الرسائل ==============
    function renderMessages() {
        analysisArea.innerHTML = '';
        chatHistory.forEach((msg, idx) => {
            if (msg.sender === 'assistant' && msg.reportHtml) {
                analysisArea.innerHTML += msg.reportHtml;
            } else {
                const div = document.createElement('div');
                div.className = 'report-container';
                div.innerHTML = `
                    <div class="report-header">
                        <strong>${msg.sender === 'user' ? '👤 المستخدم' : '🦷 MAEK7 AI'}</strong>
                        ${msg.date ? `<span style="font-size: 11px; color: var(--text-muted);">${new Date(msg.date).toLocaleTimeString('ar')}</span>` : ''}
                    </div>
                    <div>${(msg.text || '').replace(/\n/g, '<br>')}</div>
                `;
                analysisArea.appendChild(div);
            }
        });
        analysisArea.scrollTop = analysisArea.scrollHeight;
    }

    function updateHistoryList() {
        const reports = chatHistory.filter(m => m.isReport);
        if (reports.length === 0) {
            historyList.innerHTML = '<div style="color: var(--text-muted); font-size:13px; text-align:center;">لا توجد تقارير</div>';
            return;
        }
        historyList.innerHTML = reports.slice().reverse().map((r, i) => `
            <div class="history-item" onclick="window.scrollToReport(${chatHistory.indexOf(r)})">
                🦷 تقرير ${new Date(r.date || Date.now()).toLocaleDateString('ar')}
                <span style="color:${r.riskScore > 70 ? '#ef4444' : (r.riskScore > 40 ? '#f59e0b' : '#10b981')};"> (خطر ${r.riskScore || 50}%)</span>
            </div>
        `).join('');
    }

    window.scrollToReport = (index) => {
        const elements = document.querySelectorAll('.report-container');
        if (elements[index]) elements[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    // ============== تحليل الصورة ==============
    async function analyzeImage(base64, question) {
        if (!hasValidApiKey()) {
            throw new Error("يرجى إدخال مفتاح Gemini API الصحيح (يبدأ بـ AIza...)");
        }

        const genAI = new GoogleGenerativeAI(apiInput.value.trim());
        const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });

        const prompt = `أنت خبير أشعة أسنان سريري. قم بتحليل صورة الأشعة المرفقة واكتب تقريراً واحداً فقط (لا تكرر المعلومات).

⚠️ تعليمات مهمة:
- لا تكرر نفس المعلومات أو العناوين أكثر من مرة
- استخدم المصطلحات الطبية الصحيحة: "السن" 
- استخدم مؤشرات الخطر: "عالي" أو "متوسط" أو "منخفض"

أخرج التقرير بالضبط بهذا التنسيق (HTML):

<div class="report-container">
    <div class="report-header">
        <strong>📋 تقرير تحليل أشعة الأسنان</strong>
        <div class="risk-score">مؤشر الخطر الإجمالي: [X]%</div>
    </div>
    <div>
        <h4>🔍 النتائج السريرية:</h4>
        <p>• اذكر النتائج التي وجدتها فقط</p>
    </div>
    <div>
        <h4>📝 الخطة العلاجية المقترحة:</h4>
        <ul>
            <li>التوصيات حسب النتائج</li>
        </ul>
    </div>
    <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted);">
        ⚠️ هذا التقرير أولي وليس بديلاً عن التشخيص السريري النهائي.
    </div>
</div>

السؤال: ${question || "تحليل شامل"}`;

        const result = await model.generateContent([prompt, { inlineData: { data: base64.split(',')[1], mimeType: "image/jpeg" } }]);
        let html = result.response.text();
        
        let riskScore = 50;
        const riskMatch = html.match(/(\d{1,3})%/);
        if (riskMatch) riskScore = parseInt(riskMatch[1]);
        
        return { html: html, riskScore };
    }

    // ============== إرسال الرسائل ==============
    async function sendMessage() {
        // منع التكرار أثناء المعالجة
        if (isProcessing) {
            showToast("⏳ يرجى الانتظار حتى تكتمل المعالجة الحالية");
            return;
        }

        const text = userMessage.value.trim();
        if (!text) {
            showToast("✏️ يرجى كتابة رسالة أو رفع صورة");
            return;
        }

        isProcessing = true;
        
        // إضافة رسالة المستخدم
        chatHistory.push({ sender: 'user', text: text, date: Date.now() });
        saveChat();
        renderMessages();
        
        // مسح حقل الإدخال
        userMessage.value = '';
        
        // مؤقت للرد
        const waitIdx = chatHistory.length;
        chatHistory.push({ sender: 'assistant', text: "🤖 جاري التفكير...", date: Date.now() });
        saveChat();
        renderMessages();
        
        try {
            // التحقق من وجود مفتاح صالح
            if (!hasValidApiKey()) {
                throw new Error("يرجى إدخال مفتاح Gemini API الصحيح");
            }
            
            const genAI = new GoogleGenerativeAI(apiInput.value.trim());
            const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });
            const result = await model.generateContent(text);
            const answer = result.response.text();
            
            chatHistory[waitIdx] = { sender: 'assistant', text: answer, date: Date.now() };
            saveChat();
            renderMessages();
        } catch (err) {
            chatHistory[waitIdx] = { sender: 'assistant', text: `❌ خطأ: ${err.message}`, date: Date.now() };
            saveChat();
            renderMessages();
            showToast(err.message, true);
        } finally {
            isProcessing = false;
        }
    }

    async function sendImage(file) {
        if (isProcessing) {
            showToast("⏳ يرجى الانتظار حتى تكتمل المعالجة الحالية");
            return;
        }

        if (!hasValidApiKey()) {
            showToast("⚠️ يرجى إدخال مفتاح Gemini API أولاً", true);
            return;
        }

        if (!file || !file.type.startsWith('image/')) {
            showToast("يرجى اختيار صورة صالحة", true);
            return;
        }

        isProcessing = true;
        
        const reader = new FileReader();
        reader.onload = async (e) => {
            const base64 = e.target.result;
            const question = userMessage.value.trim() || "تحليل شامل للأشعة";
            
            // إضافة رسالة المستخدم
            chatHistory.push({ sender: 'user', text: "📸 [صورة أشعة] " + (question !== "تحليل شامل للأشعة" ? question : ""), date: Date.now() });
            saveChat();
            renderMessages();
            
            userMessage.value = '';
            
            const waitIdx = chatHistory.length;
            chatHistory.push({ sender: 'assistant', text: "🔍 جاري تحليل الصورة...", date: Date.now() });
            saveChat();
            renderMessages();
            
            try {
                const analysis = await analyzeImage(base64, question);
                chatHistory[waitIdx] = {
                    sender: 'assistant',
                    text: analysis.html,
                    reportHtml: analysis.html,
                    isReport: true,
                    riskScore: analysis.riskScore,
                    date: Date.now()
                };
                saveChat();
                renderMessages();
                updateHistoryList();
                showToast("✅ اكتمل تحليل الصورة");
                
                if (analysis.riskScore > 70) {
                    showToast("⚠️ تحذير: مؤشر خطر مرتفع");
                }
            } catch (err) {
                chatHistory[waitIdx] = { sender: 'assistant', text: `❌ خطأ: ${err.message}`, date: Date.now() };
                saveChat();
                renderMessages();
                showToast(err.message, true);
            } finally {
                isProcessing = false;
            }
        };
        reader.readAsDataURL(file);
    }

    // ============== معالجة الملفات ==============
    function handleFileSelect(file) {
        if (file) sendImage(file);
    }

    // ============== تحميل البيانات ==============
    function loadData() {
        const savedKey = localStorage.getItem('maek7_api_key');
        if (savedKey) apiInput.value = savedKey;
        updateApiStatus();

        const savedChat = localStorage.getItem('maek7_chat_history');
        if (savedChat) {
            try { chatHistory = JSON.parse(savedChat); } catch(e) { chatHistory = []; }
        }
        if (chatHistory.length === 0) {
            chatHistory.push({
                sender: 'assistant',
                text: "🌟 **MAEK7 Pro - تقارير أشعة الأسنان الاحترافية**\n\nمرحباً! أنا مساعدك لتحليل صور أشعة الأسنان.\n\n**ماذا يمكنني أن أقدم؟**\n✅ كشف التسوس وقياس العمق\n✅ تحديد التهابات الجذور\n✅ قياس مستوى العظام (mm)\n✅ اكتشاف الأسنان المطمورة\n✅ خريطة أسنان تفاعلية\n✅ خطة علاجية مقترحة\n\n**للبدء:** أضف مفتاح Gemini في الأعلى ثم اكتب سؤالك أو ارفع صورة أشعة"
            });
            saveChat();
        }
        renderMessages();
        updateHistoryList();
    }

    // ============== الأحداث ==============
    // زر الإرسال
    sendBtn.addEventListener('click', (e) => {
        e.preventDefault();
        sendMessage();
    });
    
    // زر Enter
    userMessage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    
    // رفع الصور
    uploadBtn.addEventListener('click', () => fileInput.click());
    galleryBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            handleFileSelect(e.target.files[0]);
        }
        fileInput.value = '';
    });
    
    // مسح البيانات
    clearDataBtn.addEventListener('click', () => {
        Swal.fire({ title: 'تأكيد', text: 'مسح كل التقارير والمحادثات؟', icon: 'warning', showCancelButton: true, confirmButtonColor: '#10a37f' }).then((r) => {
            if (r.isConfirmed) {
                localStorage.removeItem('maek7_chat_history');
                chatHistory = [];
                loadData();
                showToast("✅ تم مسح البيانات");
            }
        });
    });
    
    // تبديل الوضع
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('maek7_theme', isLight ? 'light' : 'dark');
        
        if (isLight) {
            themeToggle.innerHTML = '☀️ <span id="themeText">الوضع الفاتح</span>';
        } else {
            themeToggle.innerHTML = '🌙 <span id="themeText">الوضع المظلم</span>';
        }
    });
    
    menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
    
    // تحميل الثيم المحفوظ
    const savedTheme = localStorage.getItem('maek7_theme');
    if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        themeToggle.innerHTML = '☀️ <span id="themeText">الوضع الفاتح</span>';
    }
    
    // بدء التشغيل
    loadData();
</script>
</body>
</html>
