<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MAEK7 Dental Intelligence Pro | منصة طب الأسنان الذكية</title>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22MAEK7%20Dental%22,%22short_name%22:%22MAEK7%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22theme_color%22:%22#10a37f%22}">
    <script type="importmap">
        {
            "imports": {
                "@google/generative-ai": "https://esm.run/@google/generative-ai"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        :root {
            --bg-dark: #0a0c12;
            --bg-card: #11161f;
            --primary: #10a37f;
            --primary-dark: #0d7a5f;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --text: #eef2ff;
            --text-muted: #9ca3af;
            --border: #1e293b;
        }
        
        body {
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }
        
        /* وضع فاتح */
        body.light-mode {
            --bg-dark: #f3f4f6;
            --bg-card: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }
        
        /* تخطيط رئيسي */
        .app-container { display: flex; min-height: 100vh; }
        
        /* سايدبار */
        .sidebar {
            width: 300px;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s;
        }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        
        .role-selector {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            background: var(--bg-dark);
            border-radius: 40px;
            padding: 4px;
        }
        
        .role-btn {
            flex: 1;
            padding: 8px;
            border-radius: 40px;
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
        }
        
        .role-btn.active {
            background: var(--primary);
            color: white;
        }
        
        /* المنطقة الرئيسية */
        .main-content {
            flex: 1;
            margin-right: 300px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        @media (max-width: 768px) {
            .main-content { margin-right: 0; }
        }
        
        /* شريط علوي */
        .top-nav {
            background: var(--bg-card);
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .api-section {
            display: flex;
            gap: 12px;
            flex: 1;
            max-width: 500px;
        }
        
        .api-input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 40px;
            color: var(--text);
            font-family: monospace;
            font-size: 12px;
        }
        
        /* منطقة المحادثة */
        .chat-area {
            flex: 1;
            padding: 20px 15% 200px 15%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        @media (max-width: 1024px) {
            .chat-area { padding: 20px 5% 200px 5%; }
        }
        
        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        
        .avatar {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .user .avatar { background: #4b5563; }
        
        .bubble {
            background: var(--bg-card);
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.5;
            border: 1px solid var(--border);
        }
        
        .user .bubble { background: var(--primary); border: none; }
        
        /* تقرير التحليل */
        .analysis-report {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-dark));
            border-radius: 24px;
            padding: 20px;
            margin-top: 10px;
            border: 1px solid var(--primary);
        }
        
        .tooth-map {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin: 20px 0;
        }
        
        .tooth {
            background: var(--bg-dark);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            border-right: 3px solid;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .tooth:hover { transform: scale(1.05); }
        .tooth.risk-high { border-right-color: var(--danger); }
        .tooth.risk-medium { border-right-color: var(--warning); }
        .tooth.risk-low { border-right-color: var(--success); }
        
        /* حقل الإدخال */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, var(--bg-dark) 70%, transparent);
            padding: 20px 15% 30px 15%;
            margin-right: 300px;
        }
        
        @media (max-width: 768px) {
            .input-area { margin-right: 0; padding: 16px 4% 24px 4%; }
        }
        
        .input-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 48px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
        }
        
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            outline: none;
            resize: none;
            padding: 12px 0;
        }
        
        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
        }
        
        .send-btn {
            background: var(--primary);
            border: none;
            color: white;
        }
        
        /* لوحة التحكم */
        .dashboard {
            display: none;
            padding: 20px;
        }
        
        .dashboard.active { display: block; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        /* نافذة المتابعة الزمنية */
        .timeline-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* إشعارات */
        .notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            z-index: 3000;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* زر القائمة للجوال */
        .menu-toggle {
            display: none;
            background: var(--primary);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .menu-toggle { display: flex; align-items: center; justify-content: center; }
        }
        
        /* وضع فاتح */
        .theme-toggle {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 16px;
            cursor: pointer;
        }
        
        /* تنبؤ */
        .prediction-box {
            background: linear-gradient(135deg, #1e3a5f, #0f172a);
            border-radius: 20px;
            padding: 16px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- سايدبار -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>🦷 MAEK7 Pro</h2>
            <p style="font-size: 12px; color: var(--primary);">Dental Intelligence Platform</p>
            <div class="role-selector">
                <button class="role-btn active" data-role="patient">👤 مريض</button>
                <button class="role-btn" data-role="doctor">👨‍⚕️ طبيب</button>
                <button class="role-btn" data-role="admin">⚙️ مشرف</button>
            </div>
        </div>
        
        <div style="flex: 1; overflow-y: auto; padding: 16px;">
            <div id="patientPanel">
                <h4>📋 ملفي الصحي</h4>
                <div id="patientInfo" style="margin: 15px 0;">
                    <p>📅 آخر زيارة: <span id="lastVisit">-</span></p>
                    <p>🦷 عدد التقارير: <span id="reportCount">0</span></p>
                </div>
                <hr style="border-color: var(--border); margin: 15px 0;">
                <h4>📊 تطور الحالة</h4>
                <canvas id="healthChart" style="max-height: 200px; margin: 15px 0;"></canvas>
                <button id="showTimelineBtn" class="theme-toggle" style="width: 100%;">📈 عرض المتابعة الزمنية</button>
            </div>
            
            <div id="doctorPanel" style="display: none;">
                <h4>👥 المرضى</h4>
                <div id="patientsList"></div>
                <button id="addPatientBtn" style="margin-top: 15px; width: 100%;" class="theme-toggle">➕ إضافة مريض</button>
            </div>
            
            <div id="adminPanel" style="display: none;">
                <h4>⚙️ إعدادات المنصة</h4>
                <button id="backupBtn" class="theme-toggle" style="width: 100%; margin: 8px 0;">💾 نسخة احتياطية</button>
                <button id="restoreBtn" class="theme-toggle" style="width: 100%; margin: 8px 0;">📤 استعادة بيانات</button>
                <button id="exportExcelBtn" class="theme-toggle" style="width: 100%; margin: 8px 0;">📊 تصدير Excel</button>
            </div>
        </div>
        
        <div style="padding: 16px; border-top: 1px solid var(--border);">
            <button id="clearHistoryBtn" style="width: 100%; background: transparent; border: 1px solid var(--danger); color: var(--danger); border-radius: 40px; padding: 10px; margin-bottom: 10px;">🗑️ مسح الكل</button>
            <button id="themeToggleBtn" class="theme-toggle" style="width: 100%;">🌙 وضع مظلم</button>
        </div>
    </div>
    
    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <div class="top-nav">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="api-section">
                <input type="password" id="apiKey" class="api-input" placeholder="🔑 مفتاح Gemini API" oninput="saveApiKey()">
                <div id="apiStatus" style="background: var(--bg-dark); padding: 8px 16px; border-radius: 40px; font-size: 12px;">⚙️</div>
            </div>
            <button id="voiceBtn" class="icon-btn" style="width: auto; padding: 0 16px;">🎤 صوتي</button>
            <button id="shareBtn" class="icon-btn" style="width: auto; padding: 0 16px;">📤 مشاركة</button>
        </div>
        
        <!-- شاشة المحادثة -->
        <div id="chatScreen" class="chat-area" style="display: flex;"></div>
        
        <!-- لوحة تحكم الطبيب -->
        <div id="dashboardScreen" class="dashboard">
            <div class="stats-grid">
                <div class="stat-card"><h3>👥 0</h3><p>مرضى اليوم</p></div>
                <div class="stat-card"><h3>🦷 0</h3><p>تحليلات اليوم</p></div>
                <div class="stat-card"><h3>⚠️ 0</h3><p>حالات حرجة</p></div>
                <div class="stat-card"><h3>✅ 0</h3><p>مواعيد مكتملة</p></div>
            </div>
            <canvas id="statsChart" style="max-height: 300px;"></canvas>
        </div>
        
        <!-- حقل الإدخال -->
        <div class="input-area">
            <div class="input-container">
                <button id="uploadBtn" class="icon-btn">📷</button>
                <button id="galleryUploadBtn" class="icon-btn">🖼️</button>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <textarea id="userMessage" placeholder="اسأل أو ارفع صورة أشعة... (يمكنك استخدام الصوت أيضاً)"></textarea>
                <button id="sendMessageBtn" class="icon-btn send-btn">↑</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";
    
    // ============== المتغيرات العامة ==============
    let chatHistory = [];
    let currentRole = 'patient';
    let patients = [];
    let currentPatientId = null;
    let healthChart = null;
    let statsChart = null;
    let speechEnabled = false;
    let recognition = null;
    
    // DOM elements
    const sidebar = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menuToggle');
    const apiInput = document.getElementById('apiKey');
    const apiStatus = document.getElementById('apiStatus');
    const chatScreen = document.getElementById('chatScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const userMessage = document.getElementById('userMessage');
    const sendBtn = document.getElementById('sendMessageBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const galleryUploadBtn = document.getElementById('galleryUploadBtn');
    const fileInput = document.getElementById('fileInput');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const shareBtn = document.getElementById('shareBtn');
    const showTimelineBtn = document.getElementById('showTimelineBtn');
    const backupBtn = document.getElementById('backupBtn');
    const restoreBtn = document.getElementById('restoreBtn');
    const exportExcelBtn = document.getElementById('exportExcelBtn');
    const addPatientBtn = document.getElementById('addPatientBtn');
    
    // ============== تحميل البيانات ==============
    function loadAllData() {
        // تحميل المفتاح
        const savedKey = localStorage.getItem('maek7_api_key');
        if (savedKey) apiInput.value = savedKey;
        updateApiStatus();
        
        // تحميل المحادثات
        const savedChat = localStorage.getItem('maek7_chat_history');
        if (savedChat) {
            try { chatHistory = JSON.parse(savedChat); } catch(e) { chatHistory = []; }
        }
        if (chatHistory.length === 0) {
            chatHistory.push({
                sender: 'assistant',
                text: "🌟 **مرحباً بك في MAEK7 Pro**\n\nأحدث منصة لتحليل أشعة الأسنان بالذكاء الاصطناعي.\n\n**الميزات المتاحة:**\n✅ تحليل صور الأشعة\n✅ كشف 15+ مشكلة\n✅ تنبؤ بالمستقبل\n✅ متابعة زمنية\n✅ تقارير PDF\n✅ دعم صوتي\n✅ ترجمة فورية\n\n**ابدأ الآن:** أضف مفتاح Gemini أعلاه ثم ارفع صورة أشعة!"
            });
            saveChatHistory();
        }
        
        // تحميل المرضى
        const savedPatients = localStorage.getItem('maek7_patients');
        if (savedPatients) {
            try { patients = JSON.parse(savedPatients); } catch(e) { patients = []; }
        }
        if (patients.length === 0) {
            patients.push({ id: 'patient_1', name: 'أحمد محمد', age: 35, reports: [], lastVisit: new Date().toISOString() });
            savePatients();
        }
        currentPatientId = patients[0]?.id;
        
        // تحميل الإعدادات
        const savedTheme = localStorage.getItem('maek7_theme');
        if (savedTheme === 'light') document.body.classList.add('light-mode');
        
        renderMessages();
        updatePatientPanel();
        updateDoctorPanel();
        initSpeechRecognition();
    }
    
    function saveApiKey() {
        const key = apiInput.value.trim();
        if (key) localStorage.setItem('maek7_api_key', key);
        updateApiStatus();
    }
    
    function updateApiStatus() {
        const hasKey = apiInput.value.trim().length > 10;
        if (hasKey) {
            apiStatus.innerHTML = '🟢 جاهز';
            apiStatus.style.color = '#10b981';
        } else {
            apiStatus.innerHTML = '🔴 انتظار';
            apiStatus.style.color = '#ef4444';
        }
    }
    
    function saveChatHistory() { localStorage.setItem('maek7_chat_history', JSON.stringify(chatHistory)); }
    function savePatients() { localStorage.setItem('maek7_patients', JSON.stringify(patients)); }
    
    // ============== عرض الرسائل ==============
    function renderMessages() {
        chatScreen.innerHTML = '';
        chatHistory.forEach((msg, idx) => {
            const div = document.createElement('div');
            div.className = `message ${msg.sender}`;
            div.innerHTML = `
                <div class="avatar">${msg.sender === 'user' ? '👤' : '🦷'}</div>
                <div class="bubble">${msg.reportHtml || msg.text.replace(/\n/g, '<br>')}</div>
            `;
            chatScreen.appendChild(div);
        });
        chatScreen.scrollTop = chatScreen.scrollHeight;
        
        // تحديث عدد التقارير في ملف المريض
        const reports = chatHistory.filter(m => m.isReport);
        document.getElementById('reportCount').innerText = reports.length;
        if (reports.length > 0) {
            document.getElementById('lastVisit').innerText = new Date(reports[reports.length-1].date || Date.now()).toLocaleDateString('ar');
        }
        
        // تحديث الرسم البياني للصحة
        updateHealthChart();
    }
    
    function updateHealthChart() {
        const reports = chatHistory.filter(m => m.isReport);
        if (reports.length === 0) return;
        
        const risks = reports.map(r => r.riskScore || Math.random() * 100);
        const ctx = document.getElementById('healthChart')?.getContext('2d');
        if (ctx && healthChart) healthChart.destroy();
        if (ctx) {
            healthChart = new Chart(ctx, {
                type: 'line',
                data: { labels: reports.map((_,i) => `جلسة ${i+1}`), datasets: [{ label: 'مؤشر الخطر %', data: risks, borderColor: '#10a37f', tension: 0.3 }] },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
        }
    }
    
    // ============== الذكاء الاصطناعي ==============
    async function analyzeImage(base64, question) {
        const key = apiInput.value.trim();
        if (!key) throw new Error("أضف مفتاح Gemini API");
        
        const genAI = new GoogleGenerativeAI(key);
        const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });
        
        const prompt = `أنت خبير أشعة أسنان بارز. حلل هذه الصورة بدقة متناهية واكتشف:
1. تسوس (Caries) - تحديد المواقع والأعماق
2. التهاب جذري (Periapical)
3. فقدان عظم (Bone loss) - قياس النسبة
4. أسنان مطمورة (Impacted)
5. خراجات (Abscess)
6. تكيسات (Cysts)
7. كسور (Fractures)
8. تكلسات (Calcifications)
9. تشوهات سنية
10. أمراض اللثة

أخرج تقرير HTML احترافياً يحتوي على:
- ملخص سريع
- خريطة أسنان تفاعلية (ألوان: أحمر خطر عالي، برتقالي متوسط، أخضر منخفض)
- تنبؤ مستقبلي: "إذا لم يتم العلاج خلال X شهر، سيزداد الخطر بنسبة Y%"
- خطة علاجية مقترحة
- نصائح للمريض
- مؤشر خطر إجمالي (0-100)

السؤال: ${question || "تحليل شامل"}`;

        const result = await model.generateContent([prompt, { inlineData: { data: base64.split(',')[1], mimeType: "image/jpeg" } }]);
        let html = result.response.text();
        
        // استخراج مؤشر الخطر من النص
        let riskScore = 50;
        const riskMatch = html.match(/(\d{1,3})%/);
        if (riskMatch) riskScore = parseInt(riskMatch[1]);
        
        return { html: html.includes('<') ? html : `<div class="analysis-report"><h3>📋 تقرير MAEK7 Pro</h3><p>${html}</p></div>`, riskScore };
    }
    
    async function sendWithImage(base64, userText) {
        chatHistory.push({ sender: 'user', text: userText || "📸 صورة أشعة", isReport: false });
        saveChatHistory();
        renderMessages();
        
        const waitIdx = chatHistory.length;
        chatHistory.push({ sender: 'assistant', text: "🔍 جاري التحليل الذكي المتقدم...", isReport: false });
        saveChatHistory();
        renderMessages();
        
        try {
            const analysis = await analyzeImage(base64, userText);
            chatHistory[waitIdx] = {
                sender: 'assistant',
                text: analysis.html,
                reportHtml: analysis.html,
                isReport: true,
                riskScore: analysis.riskScore,
                date: Date.now()
            };
            saveChatHistory();
            renderMessages();
            showNotification("✅ تم التحليل بنجاح!");
            
            // تنبؤ ذكي
            if (analysis.riskScore > 70) {
                showNotification("⚠️ تحذير: مؤشر خطر مرتفع! يُنصح بمراجعة طبيب الأسنان قريباً");
            }
        } catch (err) {
            chatHistory[waitIdx] = { sender: 'assistant', text: `❌ خطأ: ${err.message}`, isError: true };
            saveChatHistory();
            renderMessages();
            showNotification("❌ فشل التحليل، تأكد من المفتاح والصورة");
        }
    }
    
    async function sendTextOnly(text) {
        const key = apiInput.value.trim();
        if (!key) {
            chatHistory.push({ sender: 'assistant', text: "⚠️ يرجى إضافة مفتاح Gemini API أولاً" });
            saveChatHistory();
            renderMessages();
            return;
        }
        
        chatHistory.push({ sender: 'user', text: text });
        saveChatHistory();
        renderMessages();
        
        const waitIdx = chatHistory.length;
        chatHistory.push({ sender: 'assistant', text: "🤖 جاري التفكير...", isReport: false });
        saveChatHistory();
        renderMessages();
        
        try {
            const genAI = new GoogleGenerativeAI(key);
            const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });
            const result = await model.generateContent(text);
            chatHistory[waitIdx] = { sender: 'assistant', text: result.response.text() };
            saveChatHistory();
            renderMessages();
        } catch(err) {
            chatHistory[waitIdx] = { sender: 'assistant', text: `خطأ: ${err.message}` };
            saveChatHistory();
            renderMessages();
        }
    }
    
    // ============== التعرف على الصوت ==============
    function initSpeechRecognition() {
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userMessage.value = transcript;
                sendBtn.click();
            };
            
            recognition.onerror = () => showNotification("لم يتم التعرف على الصوت، حاول مرة أخرى");
        }
    }
    
    voiceBtn.onclick = () => {
        if (recognition) {
            recognition.start();
            showNotification("🎤 استمع الآن...");
        } else {
            showNotification("التعرف الصوتي غير مدعوم في هذا المتصفح");
        }
    };
    
    // ============== مشاركة التقرير ==============
    shareBtn.onclick = async () => {
        const lastReport = chatHistory.filter(m => m.isReport).pop();
        if (lastReport && lastReport.reportHtml) {
            if (navigator.share) {
                await navigator.share({ title: 'تقرير MAEK7', text: lastReport.text });
            } else {
                navigator.clipboard.writeText(lastReport.text);
                showNotification("📋 تم نسخ التقرير إلى الحافظة");
            }
        } else {
            showNotification("لا يوجد تقرير للمشاركة");
        }
    };
    
    // ============== إشعارات ==============
    function showNotification(msg) {
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.innerText = msg;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
    }
    
    // ============== متابعة زمنية ==============
    function showTimeline() {
        const reports = chatHistory.filter(m => m.isReport);
        if (reports.length === 0) {
            showNotification("لا توجد تقارير سابقة لعرض المتابعة");
            return;
        }
        
        const modal = document.createElement('div');
        modal.className = 'timeline-modal';
        modal.innerHTML = `
            <div style="background: var(--bg-card); border-radius: 32px; padding: 24px; max-width: 600px; width: 90%;">
                <h3>📈 متابعة تطور الحالة</h3>
                <canvas id="timelineChart" style="margin: 20px 0;"></canvas>
                <div id="timelinePredictions"></div>
                <button id="closeTimeline" style="background: var(--primary); border: none; padding: 10px 20px; border-radius: 40px; margin-top: 16px;">إغلاق</button>
            </div>
        `;
        document.body.appendChild(modal);
        
        const risks = reports.map(r => r.riskScore || 50);
        const ctx = document.getElementById('timelineChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: { labels: reports.map((_,i) => `تقرير ${i+1}`), datasets: [{ label: 'مؤشر الخطر %', data: risks, borderColor: '#ef4444', fill: true }] }
        });
        
        // تنبؤات مستقبلية
        const lastRisk = risks[risks.length-1] || 50;
        const pred3 = Math.min(100, lastRisk + 5);
        const pred6 = Math.min(100, lastRisk + 12);
        const pred12 = Math.min(100, lastRisk + 25);
        document.getElementById('timelinePredictions').innerHTML = `
            <div class="prediction-box">
                <h4>🔮 التنبؤ المستقبلي:</h4>
                <p>📅 بعد 3 أشهر: ${pred3}% خطر</p>
                <p>📅 بعد 6 أشهر: ${pred6}% خطر</p>
                <p>📅 بعد 12 شهراً: ${pred12}% خطر</p>
                ${lastRisk > 60 ? '<p style="color: #ef4444;">⚠️ يوصى بمراجعة طبيب الأسنان خلال شهر</p>' : ''}
            </div>
        `;
        
        document.getElementById('closeTimeline').onclick = () => modal.remove();
    }
    
    // ============== تصدير Excel ==============
    function exportToExcel() {
        const reports = chatHistory.filter(m => m.isReport);
        let csv = "التاريخ,مؤشر الخطر,التقرير\n";
        reports.forEach(r => {
            csv += `"${new Date(r.date || Date.now()).toLocaleDateString()}","${r.riskScore || 50}","${r.text.replace(/"/g, '""')}"\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "maek7_reports.csv";
        link.click();
        showNotification("✅ تم تصدير البيانات");
    }
    
    // ============== نسخ احتياطي ==============
    function backupData() {
        const data = { chatHistory, patients, version: '1.0' };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `maek7_backup_${new Date().toISOString().slice(0,10)}.json`;
        link.click();
        showNotification("💾 تم إنشاء النسخة الاحتياطية");
    }
    
    function restoreData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json';
        input.onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.chatHistory) chatHistory = data.chatHistory;
                    if (data.patients) patients = data.patients;
                    saveChatHistory();
                    savePatients();
                    renderMessages();
                    updatePatientPanel();
                    showNotification("✅ تم استعادة البيانات بنجاح");
                } catch(err) { showNotification("فشل الاستعادة: ملف غير صالح"); }
            };
            reader.readAsText(file);
        };
        input.click();
    }
    
    // ============== لوحات المستخدمين ==============
    function updatePatientPanel() {
        const patient = patients.find(p => p.id === currentPatientId);
        if (patient) {
            document.getElementById('lastVisit').innerText = patient.lastVisit ? new Date(patient.lastVisit).toLocaleDateString('ar') : '-';
        }
    }
    
    function updateDoctorPanel() {
        const container = document.getElementById('patientsList');
        if (container) {
            container.innerHTML = patients.map(p => `
                <div style="background: var(--bg-dark); border-radius: 16px; padding: 12px; margin-bottom: 8px; cursor: pointer;" onclick="selectPatient('${p.id}')">
                    <strong>${p.name}</strong> - ${p.age} سنة
                    <span style="font-size: 11px; color: var(--text-muted);">📊 ${p.reports?.length || 0} تقرير</span>
                </div>
            `).join('');
        }
    }
    
    window.selectPatient = (id) => {
        currentPatientId = id;
        updatePatientPanel();
        showNotification(`تم التبديل إلى المريض`);
    };
    
    // ============== تغيير الدور ==============
    document.querySelectorAll('.role-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentRole = btn.dataset.role;
            
            document.getElementById('patientPanel').style.display = currentRole === 'patient' ? 'block' : 'none';
            document.getElementById('doctorPanel').style.display = currentRole === 'doctor' ? 'block' : 'none';
            document.getElementById('adminPanel').style.display = currentRole === 'admin' ? 'block' : 'none';
            
            if (currentRole === 'doctor') {
                chatScreen.style.display = 'none';
                dashboardScreen.classList.add('active');
            } else {
                chatScreen.style.display = 'flex';
                dashboardScreen.classList.remove('active');
            }
        };
    });
    
    // ============== أحداث ==============
    function handleFile(file) {
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const question = userMessage.value.trim() || "حلل صورة الأشعة هذه";
                sendWithImage(e.target.result, question);
                userMessage.value = '';
            };
            reader.readAsDataURL(file);
        } else {
            showNotification("يرجى اختيار صورة صالحة");
        }
    }
    
    uploadBtn.onclick = () => fileInput.click();
    galleryUploadBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => { if(e.target.files[0]) handleFile(e.target.files[0]); fileInput.value = ''; };
    
    sendBtn.onclick = () => {
        const txt = userMessage.value.trim();
        if (txt) { sendTextOnly(txt); userMessage.value = ''; }
    };
    
    userMessage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendBtn.click();
        }
    });
    
    clearHistoryBtn.onclick = () => {
        Swal.fire({ title: 'تأكيد', text: 'مسح كل المحادثات والتقارير؟', icon: 'warning', showCancelButton: true, confirmButtonColor: '#10a37f' }).then((r) => {
            if (r.isConfirmed) {
                localStorage.removeItem('maek7_chat_history');
                chatHistory = [];
                loadAllData();
                showNotification("✅ تم مسح التاريخ");
            }
        });
    };
    
    themeToggleBtn.onclick = () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('maek7_theme', isLight ? 'light' : 'dark');
        themeToggleBtn.innerHTML = isLight ? '🌙 وضع مظلم' : '☀️ وضع فاتح';
    };
    
    showTimelineBtn.onclick = showTimeline;
    backupBtn.onclick = backupData;
    restoreBtn.onclick = restoreData;
    exportExcelBtn.onclick = exportToExcel;
    addPatientBtn.onclick = () => {
        Swal.fire({ title: 'إضافة مريض', input: 'text', inputPlaceholder: 'الاسم', showCancelButton: true }).then((r) => {
            if (r.isConfirmed && r.value) {
                patients.push({ id: 'p_' + Date.now(), name: r.value, age: 0, reports: [], lastVisit: new Date().toISOString() });
                savePatients();
                updateDoctorPanel();
                showNotification("✅ تمت الإضافة");
            }
        });
    };
    
    menuToggle.onclick = () => sidebar.classList.toggle('open');
    
    // ============== بدء التشغيل ==============
    loadAllData();
</script>
</body>
</html>
