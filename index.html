<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MAEK7 Dental Intelligence | التحليل الذكي لأشعة الأسنان</title>
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTUFFSzciLCJzaG9ydF9uYW1lIjoiTUFFSzcgRGVudGFsIiwic3RhcnRfdXJsIjoiLyIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwidGhlbWVfY29sb3IiOiIjMTBhMzdmIn0=">
    <script type="importmap">
        {
            "imports": {
                "@google/generative-ai": "https://esm.run/@google/generative-ai"
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0c12;
            color: #eef2ff;
            min-height: 100vh;
        }

        /* تخطيط رئيسي */
        .app-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* السايدبار */
        .sidebar {
            width: 280px;
            background: #05070c;
            border-left: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
            overflow-y: auto;
        }

        .logo-area {
            background: #0f131c;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #10a37f30;
        }

        .history-item {
            background: #0f131c;
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            border-right: 3px solid #10a37f;
            font-size: 13px;
        }

        .clear-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid #ef4444;
            color: #f87171;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        /* المنطقة الرئيسية */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            background: #0a0d12;
            padding: 12px 20px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .api-input {
            flex: 1;
            background: #111827;
            border: 1px solid #2d3a4e;
            padding: 10px 16px;
            border-radius: 40px;
            color: white;
            font-family: monospace;
            font-size: 13px;
            direction: ltr;
        }

        .status-badge {
            background: #11161f;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
        }

        /* منطقة الرسائل */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 12% 180px 12%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .messages-area { padding: 16px 4% 180px 4%; }
        }

        .msg {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }

        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar {
            width: 38px;
            height: 38px;
            background: #10a37f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .user .avatar { background: #334155; }
        .bubble {
            background: #1e2538;
            padding: 12px 18px;
            border-radius: 24px;
            line-height: 1.5;
        }
        .user .bubble { background: #0f6b58; }

        /* معاينة الصورة */
        .preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .preview-card {
            background: #11161f;
            border-radius: 32px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .preview-img {
            max-width: 100%;
            border-radius: 20px;
            margin: 16px 0;
        }
        .draw-tools {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 12px 0;
        }
        .tool-btn {
            background: #1e2a3a;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 12px;
            cursor: pointer;
        }

        /* حقل الإدخال */
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #0a0c12 70%, transparent);
            padding: 20px 12% 30px 12%;
        }
        @media (max-width: 900px) {
            .input-container { padding: 12px 4% 20px 4%; }
        }
        .input-panel {
            background: #11161f;
            border: 1px solid #2a3748;
            border-radius: 48px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 16px;
        }
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            outline: none;
            resize: none;
            padding: 12px 0;
        }
        button {
            background: #2a3748;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 60px;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
        }
        .upload-btn, .gallery-btn { background: #1e2a3a; }
        .send-btn { background: #10a37f; color: white; }
        .print-pdf-btn { background: #2d3a5e; width: auto; padding: 0 16px; font-size: 13px; }
    </style>
</head>
<body>
<div class="app-layout">
    <div class="sidebar">
        <div>
            <div class="logo-area">
                <h2>🦷 MAEK7</h2>
                <p style="font-size: 11px; color: #10a37f;">Dental Intelligence</p>
            </div>
            <div style="font-weight: bold; margin-bottom: 12px;">📋 التقارير السابقة</div>
            <div id="historyList"></div>
        </div>
        <div>
            <button class="clear-btn" id="clearAllHistory">🗑️ مسح الكل</button>
            <div style="font-size: 11px; text-align: center; margin-top: 16px;">🔒 بياناتك محلياً</div>
        </div>
    </div>

    <div class="main-area">
        <div class="top-bar">
            <input type="password" id="apiKeyInput" class="api-input" placeholder="🔑 مفتاح Gemini API (AIza...)" oninput="saveKey()">
            <div id="apiStatus" class="status-badge">⚙️ انتظار المفتاح</div>
            <button id="printReportBtn" class="print-pdf-btn" style="display:none;">📄 PDF</button>
        </div>

        <div class="messages-area" id="messagesContainer"></div>

        <div class="input-container">
            <div class="input-panel">
                <button class="upload-btn" id="cameraBtn" title="رفع صورة">📷</button>
                <button class="gallery-btn" id="galleryBtn" title="اختيار من المعرض">🖼️</button>
                <input type="file" id="fileUpload" accept="image/*" style="display:none">
                <textarea id="userMessage" placeholder="اسأل أو ارفع صورة أشعة..."></textarea>
                <button class="send-btn" id="sendBtn">↑</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";
    
    // DOM
    const messagesDiv = document.getElementById('messagesContainer');
    const apiInput = document.getElementById('apiKeyInput');
    const statusSpan = document.getElementById('apiStatus');
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userMessage');
    const cameraBtn = document.getElementById('cameraBtn');
    const galleryBtn = document.getElementById('galleryBtn');
    const fileInput = document.getElementById('fileUpload');
    const clearHistoryBtn = document.getElementById('clearAllHistory');
    const printBtn = document.getElementById('printReportBtn');
    const historyDiv = document.getElementById('historyList');
    
    let chatHistory = [];
    let currentPreviewImage = null;
    let currentReportHTML = null;
    
    // تحميل البيانات
    function loadData() {
        const savedKey = localStorage.getItem('maek7_key');
        if (savedKey) apiInput.value = savedKey;
        updateStatus();
        
        const savedChat = localStorage.getItem('maek7_chats');
        if (savedChat) {
            try { chatHistory = JSON.parse(savedChat); } catch(e) { chatHistory = []; }
        }
        if (chatHistory.length === 0) {
            chatHistory.push({ sender: 'assistant', text: "🌟 **MAEK7 Dental Intelligence**\n\nأهلاً بك! أنا مساعدك لتحليل صور أشعة الأسنان.\n\n**للبدء:**\n1. أضف مفتاح Gemini API أعلاه\n2. ارفع صورة أشعة (تصوير شاشة أو ملف)\n3. سأحلل الصورة وأعطيك تقريراً كاملاً\n\nيمكنك أيضاً الكتابة مباشرة لأسئلة طب الأسنان." });
            saveChat();
        }
        renderMessages();
        renderHistory();
    }
    
    function saveKey() { 
        const key = apiInput.value.trim();
        if (key) localStorage.setItem('maek7_key', key);
        updateStatus();
    }
    
    function updateStatus() {
        const hasKey = apiInput.value.trim().length > 10;
        if (hasKey) {
            statusSpan.innerHTML = "🟢 AI جاهز";
            statusSpan.style.background = "#0a2f2a";
        } else {
            statusSpan.innerHTML = "🔴 أضف المفتاح";
            statusSpan.style.background = "#2d1f2a";
        }
    }
    
    function saveChat() { localStorage.setItem('maek7_chats', JSON.stringify(chatHistory)); }
    
    function renderMessages() {
        messagesDiv.innerHTML = '';
        chatHistory.forEach((msg, idx) => {
            const div = document.createElement('div');
            div.className = `msg ${msg.sender}`;
            div.innerHTML = `<div class="avatar">${msg.sender === 'user' ? 'U' : 'AI'}</div>
                             <div class="bubble">${msg.reportHtml || msg.text.replace(/\n/g, '<br>')}</div>`;
            messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        if (chatHistory.filter(m => m.isReport).length > 0) printBtn.style.display = 'flex';
        else printBtn.style.display = 'none';
    }
    
    function renderHistory() {
        const reports = chatHistory.filter(m => m.isReport);
        if (reports.length === 0) { historyDiv.innerHTML = '<div style="color:#4b5563;">لا توجد تقارير</div>'; return; }
        historyDiv.innerHTML = reports.slice().reverse().map((r, i) => `<div class="history-item" data-idx="${chatHistory.indexOf(r)}">🦷 تقرير ${new Date(r.date || Date.now()).toLocaleDateString()}</div>`).join('');
        document.querySelectorAll('.history-item').forEach(el => {
            el.onclick = () => scrollToMsg(parseInt(el.dataset.idx));
        });
    }
    
    function scrollToMsg(idx) { 
        const els = document.querySelectorAll('.msg');
        if (els[idx]) els[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    
    // تحليل الصورة
    async function analyzeImage(base64, question) {
        const key = apiInput.value.trim();
        if (!key) throw new Error("أضف مفتاح API");
        const genAI = new GoogleGenerativeAI(key);
        const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });
        const prompt = `أنت خبير أشعة أسنان. حلل هذه الصورة بدقة. اذكر: التسوس، التهاب الجذور، فقدان العظم، الأسنان المطمورة، مؤشرات الخطر (عالي/متوسط/منخفض). أخرج تقريراً بتنسيق HTML لطيفاً يحتوي على ملخص، خريطة أسنان افتراضية (ألوان حسب الخطر)، ونصائح للمريض. السؤال: ${question || "تحليل شامل"}`;
        const result = await model.generateContent([prompt, { inlineData: { data: base64.split(',')[1], mimeType: "image/jpeg" } }]);
        const html = result.response.text();
        return { html: html.includes('<') ? html : `<div class="report-card"><h3>📋 التقرير</h3><p>${html}</p></div>`, raw: html };
    }
    
    async function sendWithImage(base64, userText) {
        chatHistory.push({ sender: 'user', text: userText || "📸 صورة أشعة", isReport: false });
        saveChat(); renderMessages();
        const waitIdx = chatHistory.length;
        chatHistory.push({ sender: 'assistant', text: "🔍 جاري التحليل الذكي...", isReport: false });
        saveChat(); renderMessages();
        try {
            const analysis = await analyzeImage(base64, userText);
            chatHistory[waitIdx] = { sender: 'assistant', text: analysis.raw, reportHtml: analysis.html, isReport: true, date: Date.now() };
            currentReportHTML = analysis.html;
            saveChat(); renderMessages(); renderHistory();
        } catch (err) {
            chatHistory[waitIdx] = { sender: 'assistant', text: `❌ خطأ: ${err.message}`, isError: true };
            saveChat(); renderMessages();
        }
    }
    
    async function sendTextOnly(text) {
        const key = apiInput.value.trim();
        if (!key) {
            chatHistory.push({ sender: 'assistant', text: "⚠️ يرجى إضافة مفتاح Gemini أولاً" });
            saveChat(); renderMessages();
            return;
        }
        chatHistory.push({ sender: 'user', text: text });
        saveChat(); renderMessages();
        const waitIdx = chatHistory.length;
        chatHistory.push({ sender: 'assistant', text: "🤖 جاري التفكير..." });
        saveChat(); renderMessages();
        try {
            const genAI = new GoogleGenerativeAI(key);
            const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });
            const res = await model.generateContent(text);
            chatHistory[waitIdx] = { sender: 'assistant', text: res.response.text() };
            saveChat(); renderMessages();
        } catch(err) {
            chatHistory[waitIdx] = { sender: 'assistant', text: `خطأ: ${err.message}` };
            saveChat(); renderMessages();
        }
    }
    
    // معاينة الصورة مع أدوات الرسم
    function showPreviewWithDrawing(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const base64 = e.target.result;
            currentPreviewImage = base64;
            const modal = document.createElement('div');
            modal.className = 'preview-modal';
            modal.innerHTML = `
                <div class="preview-card">
                    <h3>📸 معاينة الصورة</h3>
                    <img src="${base64}" class="preview-img" id="previewImg" style="max-width:100%; border-radius:16px;">
                    <div class="draw-tools">
                        <button class="tool-btn" id="drawCircle">⚪ دائرة</button>
                        <button class="tool-btn" id="drawRect">📦 مستطيل</button>
                        <button class="tool-btn" id="resetDraw">🗑️ مسح</button>
                    </div>
                    <div style="display: flex; gap:12px; margin-top:16px;">
                        <button id="confirmImage" style="background:#10a37f;">✅ تأكيد وتحليل</button>
                        <button id="cancelPreview" style="background:#4b5563;">إلغاء</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            let canvasAdded = false;
            let ctx, canvas;
            document.getElementById('confirmImage').onclick = () => {
                modal.remove();
                const userQ = userInput.value.trim() || "حلل صورة الأشعة هذه";
                sendWithImage(base64, userQ);
                userInput.value = '';
            };
            document.getElementById('cancelPreview').onclick = () => modal.remove();
            // أدوات رسم بسيطة
            document.getElementById('drawCircle').onclick = () => alert("يمكنك الرسم على الصورة بعد حفظها، هذه نسخة تجريبية. في الإصدار القادم سيتم تفعيل الرسم المتقدم.");
            document.getElementById('drawRect').onclick = () => alert("أدوات الرسم المباشر قادمة في التحديث القادم.");
            document.getElementById('resetDraw').onclick = () => alert("سيتم إعادة تعيين الرسم لاحقاً.");
        };
        reader.readAsDataURL(file);
    }
    
    // رفع صورة
    function handleFile(file) {
        if (file && file.type.startsWith('image/')) {
            showPreviewWithDrawing(file);
        } else alert("يرجى اختيار صورة صالحة");
    }
    
    cameraBtn.onclick = () => fileInput.click();
    galleryBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => { if(e.target.files[0]) handleFile(e.target.files[0]); fileInput.value = ''; };
    
    sendBtn.onclick = () => {
        const txt = userInput.value.trim();
        if (txt) { sendTextOnly(txt); userInput.value = ''; }
    };
    userInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });
    
    clearHistoryBtn.onclick = () => {
        if(confirm("مسح كل المحادثات والتقارير؟")) {
            localStorage.removeItem('maek7_chats');
            chatHistory = [];
            loadData();
        }
    };
    
    // طباعة PDF
    printBtn.onclick = () => {
        const lastReport = chatHistory.filter(m => m.isReport).pop();
        if(lastReport && lastReport.reportHtml) {
            const win = window.open();
            win.document.write(`<html><head><title>تقرير MAEK7</title><style>body{font-family:sans-serif; padding:20px;}</style></head><body>${lastReport.reportHtml}</body></html>`);
            win.print();
        } else alert("لا يوجد تقرير حديث للطباعة");
    };
    
    loadData();
</script>
</body>
</html>
